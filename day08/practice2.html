<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bootstrap 실전 스터디</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-white">
    
<main class="container py-5">
    <section class="bg-white border rounded-4 p-4 p-md-5">
        <section class="bg-body border rounded-4 p-4 p-md-5">
            <div class="row align-items-center g-4">
                <div class="col-12 col-lg-7">
                    <span class="badge text-bg-success mb-3"> 신청 가능</span>
                    <small class="text-secondary fs-6 fw-semibold">Frontend Study #03</small>
                    <h1 class="fw-bold mb-3 fs-2">Bootstrap 실전 스터디</h1>
                    <p class="text-secondary mb-2">Bootstrap의 Grid, Utility, Component를 활용해 반응형 웹 UI를 함께 제작하는 오프라인 스터디입니다.</p>
                    <hr />

                    <div class="d-flex justify-content-between align-items-center">
                        <p class="text-secondary">일정</p>
                        <strong>9월 12일 토요일 14:00</strong>
                    </div>

                    <hr />
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <p class="text-secondary ">장소</p>
                        <strong>강남 스터디룸 A</strong>
                    </div>
                    
                    <hr />

                    <div class="d-flex justify-content-between align-items-center">
                        <p class="text-secondary">진행 시간</p>
                        <strong>약 2시간</strong>
                    </div>

                    <hr />

                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge rounded-pill text-bg-light border px-3 py-2">Grid</span>
                            <span class="badge rounded-pill text-bg-light border px-3 py-2">Utility</span>
                            <span class="badge rounded-pill text-bg-light border px-3 py-2">Responsive</span>
                        </div>
                </div>
                <div class="col-12 col-lg-5">
                    <div class="bg-light p-3 rounded-3 d-block mb-1 w-100">
                        <p class="text-secondary d-block mb-1 fw-bold">현재 신청 인원</p>
                        <div class="d-flex justify-content-between mb-1 ">
                            <strong class="text-black fs-1 fw-bold mb-1">18명</strong>
                            <div class="d-flex align-items-center">
                            <span>/ 24명</span>
                            </div>
                        </div>
                        <div class="progress mb-3"
                            role="progressbar"
                            aria-label="스터디 신청 현황"
                            aria-valuenow="75"
                            aria-valuemin="0"
                            aria-valuemax="100">
                        <div class="progress-bar" style="width: 75%">75%</div>
                        </div>
                        
                        <div class="bg-warning-subtle text-warning-emphasis fw-bold border rounded-3 d-block mb-3
                                    border-warning p-3">
                            남은 자리가 많지 않습니다.</div>
                        <div>
                            <a href="#" class="btn btn-dark btn-lg w-100 fw-bold fs-6">스터디 참가 신청</a>
                        </div>
                    </div>
                </div>

            </div>





        </section>
    </section>
</main>












</body>
</html>
