<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Steaming Movie Card</title>
    <link rel="stylesheet" href="./dist/output.css" />
</head>
<body>
    
<header class="p-6">
        <span
            class="text-red-600 font-semibold tracking-widest">
        TAILWIND CSS · PRACTICE 01
        </span>
        
        <h1 class="text-4xl font-bold mt-3 mb-2">Movie Card</h1>
        
        <p class="text-gray-400 text-md">이미지, 오버레이, absolute positioning, group-hover, transition을 활용해 스트리밍 서비스 스타일의 컨텐츠 카드를 만들어봅니다.</p>
</header>
<section>
    <!-- 기본 카드 세팅 -->
    <article
        class="
        p-lg-5
        group
        relative
        aspect-4/5
        max-w-sm
        overflow-hidden
        rounded-2xl
        bg-zinc-900
        ">
        <!-- 이미지 설정 -->
        <img src="../assets/background01.png" alt="노을이 지고 있는 몽환적인 분위기의 배경"
             class="absolute inset-0 h-full w-full object-cover
                    transition duration-700 ease-out group-hover:scale-110">

             <!-- 이미지에 어두운 배경 처리 -->
            <div></div>

            <div class="absolute left-4 top-4 flex items-center gap-2">
                <span class="rounded-md px-3 py-1 font-bold
                            text-xs text-white bg-red-600 ">TOP 10</span>
                <span class="rounded-md px-3 py-1 font-bold
                            text-xs text-white bg-black ">15+</span>
            </div>

            <button type="button" aria-label="재생"
                    class="absolute left-1/2 top-1/2 -translate-x-1/2
                         bg-white p-3 rounded-full w-15 h-15
                         opacity-0 scale-50
                         group-hover:opacity-100 group-hover:scale-100">▶</button>

            <div class="absolute inset-x-0 bottom-0 p-5">
                <p class="font-bold text-sm tracking-wide
                        text-red-700">ORIGINAL SERIES</p>

                <h2 class="font-black text-3xl tracking-tight text-dark">NIGHTFALL</h2>

                <div class="font-semibold text-xs mt-3 flex flex-wrap items-center gap-2">
                    <span class="text-green-500">98% 일치</span>
                    <span class="text-gray-400">2026</span>
                    <span class="
                            rounded-md px-2 py-1 font-bold
                            text-xs text-white border-amber-50 bg-black/50">HD</span>
                </div>

                <p class="text-sm line-clamp-2 mt-3 mb-3 text-gray-300"
                >모든 빛이 사라진 도시에서 마지막 신호를 따라가는 세 사람의 미스터리 스릴러.</p>

                <div class="opacity-0 transition duration-500 group-hover:opacity-100
                            flex flex-wrap justify-center items-center gap-2">
                    <button type="button"
                            class="text-md font-semibold text-center
                            bg-white rounded-md w-4/6 min-h-7">▶ 재생</button>

                    <button type="button" aria-label="내가 찜한 컨텐츠에 추가"
                            class="text-md font-semibold text-center
                            bg-black text-white rounded-full w-7 min-h-7"> + </button>
                </div>
            </div>
    </article>
</section>











</body>
</html>
